<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnus Lab</title>
  <meta name="description" content="WebGPU visualization of the Magnus effect on baseball pitches">
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel-open">
  <aside id="panel">
    <header>
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#f3efe6"/><path d="M8 5.5c4 4 4 17 0 21M24 5.5c-4 4-4 17 0 21" stroke="#c8202c" stroke-width="1.6" fill="none" stroke-dasharray="1.6 1.4"/></svg>
        <div><h1>Magnus Lab</h1><p>How spin bends a pitch</p></div>
      </div>
    </header>
    <div id="controls"></div>
  </aside>

  <main id="stage">
    <canvas id="gfx"></canvas>
    <div id="labels"></div>

    <button id="menuBtn" type="button" aria-label="Toggle controls">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <nav id="cams" aria-label="Camera views"></nav>

    <section id="stats" class="card">
      <h2>Live</h2>
      <div id="live" class="kv"></div>
      <h2>At the plate</h2>
      <div id="final" class="kv"></div>
    </section>

    <section id="legend" class="card">
      <div class="grad"></div>
      <div class="grad-labels"><span>Low pressure<br><small>fast air</small></span><span>High pressure<br><small>slow air</small></span></div>
    </section>

    <section id="plateCard" class="card">
      <h2>Catcher's view <small>click to aim</small></h2>
      <canvas id="plate"></canvas>
    </section>

    <footer id="transport" class="card">
      <div class="buttons">
        <button id="btnRestart" type="button" title="Replay from release (R)"><svg viewBox="0 0 24 24"><path d="M5 4.5h2.5v15H5zM19 4.5v15L8.5 12z"/></svg></button>
        <button id="btnBack" type="button" title="Step back (←)"><svg viewBox="0 0 24 24"><path d="M15.5 6v12L7 12z"/></svg></button>
        <button id="btnRev" type="button" title="Play in reverse"></button>
        <button id="btnPlay" type="button" class="primary" title="Play / pause (Space)"></button>
        <button id="btnFwd" type="button" title="Step forward (→)"><svg viewBox="0 0 24 24"><path d="M8.5 6v12l8.5-6z"/></svg></button>
        <button id="btnLoop" type="button" title="Loop (L)"><svg viewBox="0 0 24 24"><path d="M7 7h9a4 4 0 0 1 0 8h-1M17 17H8a4 4 0 0 1 0-8h1" fill="none" stroke-width="2"/><path d="M14 12l3 3-3 3M10 6L7 9l3 3" fill="none" stroke-width="2"/></svg></button>
      </div>
      <div class="scrub">
        <input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline">
        <span id="timeLabel">0 ms</span>
      </div>
      <div id="speeds" class="seg small" title="Playback speed ([ / ])"></div>
    </footer>

    <div id="nogpu">
      <div class="card">
        <h2>WebGPU is unavailable</h2>
        <p id="nogpuMsg"></p>
        <p>Try a recent Chrome, Edge, or Safari 26+ (or Firefox with WebGPU enabled) on a machine with a supported GPU.</p>
      </div>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
